
<html lang="en">
<head>
    <meta charset="UTF=8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon-Site-Personnel</title>

    <style>
        :root {
            --primary: #0f172a;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --bg: #090d16
            --card-bg: #1e293b;
            --text: #f8fafc;
            --light-text: #94a3b8;
            --border: #334155;
            --hero-bg: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1,6;
            transition: background-color 0.3s, color 0.3s;
            overflow-x: hidden;
        }

        header{
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: var(--card-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .logo{
            font-weight: 700;
            font-size: 18px;
            color: var(--accent);
            text-decoration: none;
        }

        nav{
            display: flex;
            gap: 25px;
        }

        nav a{
            color: var(--light-text);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover{
            color: var(--accent);
        }

        .hero{
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%)
        }

        .hero h1{
            font-size: 48px;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .hero h1 span{
            color: var(--accent);
        }

        .hero p{
            font-size: 20px;
            color: var(--light-text);
            max-width: 600px;
            margin-bottom: 30px;
        }

        .cta-btn{
            background-color: var(--accent);
            color:var(--primary);
            padding: 12px 28px;
            border-radius: 6px;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 0.2s, transform 0.2s;
        }
    
        .cta-btn:hover{
            background-color: var(--accent-hover_);
            transform: translateY(-2px);
        }

        section{
            padding: 100px 20px 80px;
            max-width: 900px;
            margin: 0 auto;
            border-bottom: 1px solid var(--border);
        }

        section h2{
            font-size: 28px;
            margin-bottom: 25px;
            color:  var(--text);
            position: relative;
        }

        section h2::after{
            content: '';
            display: block;
            width: 50px;
            height: 3px;
            background-color: var(--accent);
            margin-top: 8px;
            border-radius: 2px;
        }

        p{
            color:var(--light-text);
            font-size: 16px;
            margin-bottom: 15px;
        }

        .grid-container{
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card{
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            padding: 24px;
            border-radius: 10px;
            transition: transform 0.2s;
        }

        .card:hover{
            transform: translateY(-4px);
        }

        .card h3{
            font-size: 18px;
            color: var(--text);
            margin-bottom: 8px;
        }

        .contact-links{
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .contact-btn{
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .contact-btn:hover{
            background-color: var(--border);
            border-color: var(--accent);
            color: var(--accent);
        }
    
    </style>
</head>
</html>
